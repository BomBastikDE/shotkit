name: Rust checks
on:
  push:
    branches: [main, 'rust/**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: rustfmt, clippy
      - name: Test release safety checks
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Check Rust formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Install cargo-audit
        if: runner.os == 'Linux'
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Rust dependencies
        if: runner.os == 'Linux'
        run: cargo audit
      - name: Test image and scroll logic
        run: cargo test --locked --lib
      - name: Test Windows-specific modules
        timeout-minutes: 15
        if: runner.os == 'Windows'
        run: cargo test --locked --all-targets
      - name: Require ordinary and legacy native capture buffer acceptance
        timeout-minutes: 5
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          # This desktop-dependent test remains ignored for ordinary unit-test
          # runs, but is mandatory here. Fail if renaming/removal makes Cargo
          # match zero tests, as well as when capture itself fails.
          $testName = 'scroll_windows::tests::supplied_and_legacy_capture_buffers_keep_geometry_and_opaque_alpha'
          $listed = @(& cargo test --locked --bin shotkit $testName -- --ignored --exact --list)
          if ($LASTEXITCODE -ne 0) {
            throw "Native capture acceptance discovery failed (exit $LASTEXITCODE)."
          }
          $listed | ForEach-Object { Write-Host $_ }
          if ($listed -notcontains "$($testName): test") {
            throw "Required native capture acceptance test was not discovered: $testName"
          }
          & cargo test --locked --bin shotkit $testName -- --ignored --exact --nocapture
          if ($LASTEXITCODE -ne 0) {
            throw "Required native capture acceptance failed (exit $LASTEXITCODE)."
          }
      - name: Measure preview redraw on Windows
        timeout-minutes: 15
        if: runner.os == 'Windows'
        run: cargo run --locked --release --example preview_redraw_benchmark
      - name: Build Windows application
        timeout-minutes: 15
        if: runner.os == 'Windows'
        run: cargo build --locked --release
      - name: Diagnose clipboard history availability
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: powershell
        run: |
          # Read-only capability diagnostic, not a privacy or history test.
          try {
            $clipboard = [Windows.ApplicationModel.DataTransfer.Clipboard, Windows.ApplicationModel.DataTransfer, ContentType = WindowsRuntime]
            $enabled = $clipboard::IsHistoryEnabled()
            Write-Host "CLIPBOARD_HISTORY_CAPABILITY: IsHistoryEnabled=$enabled; actual history and exclusion are not tested."
          } catch {
            Write-Host "CLIPBOARD_HISTORY_CAPABILITY: unavailable or probe failed: $($_.Exception.Message); actual history and exclusion are not tested."
          }
      - name: Verify Windows smoke suite deadline contract
        timeout-minutes: 2
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/windows-suite-budget-contract.ps1
      - name: Run all interactive Windows smoke tests
        timeout-minutes: 50
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: ./tests/run-all.ps1 -ExePath target/release/shotkit.exe -ScreenshotPath target/shotkit-toolbar-test.png
      - name: Upload toolbar test screenshot
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shotkit-toolbar-test-screenshot
          path: |
            rust/target/shotkit-toolbar-test.png
            rust/target/shotkit-held-preview-*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Upload tested Windows build
        if: ${{ success() && runner.os == 'Windows' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shotkit-windows-x64
          path: rust/target/release/shotkit.exe
          if-no-files-found: error
          retention-days: 7
