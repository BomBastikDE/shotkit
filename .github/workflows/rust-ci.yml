name: Rust checks
on:
  push:
    branches: [main, 'rust/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test image and scroll logic
        run: cargo test --locked --lib
      - name: Test Windows-specific modules
        if: runner.os == 'Windows'
        run: cargo test --locked --all-targets
      - name: Build Windows application
        if: runner.os == 'Windows'
        run: cargo build --locked --release
      - name: Interactive Windows capture smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/windows-smoke.ps1 -ExePath target/release/shotkit-rust-prototype.exe
      - name: Interactive Windows scroll capture smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/windows-scroll-smoke.ps1 -ExePath target/release/shotkit-rust-prototype.exe
      - name: Interactive Windows single-instance smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/windows-instance-smoke.ps1 -ExePath target/release/shotkit-rust-prototype.exe
      - name: Interactive Windows hover suggestion smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/windows-hover-smoke.ps1 -ExePath target/release/shotkit-rust-prototype.exe
      - name: Interactive Edge browser hover smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/windows-browser-hover-smoke.ps1 -ExePath target/release/shotkit-rust-prototype.exe
