name: Windows smoke scenario repeats

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Windows smoke scenario to run repeatedly'
        type: choice
        required: true
        default: output-matrix
        options:
          - output-matrix
          - edge-scroll
          - edge-scroll-fixed-header-footer
      repeat:
        description: 'Consecutive runs of the selected scenario (1 to 20)'
        type: number
        required: true
        default: 10

permissions:
  contents: read

jobs:
  repeat:
    runs-on: windows-2022
    timeout-minutes: 310
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: rustfmt, clippy
      - name: Build Windows application
        timeout-minutes: 15
        run: cargo build --locked --release
      - name: Repeat selected interactive Windows smoke scenario
        timeout-minutes: 285
        shell: pwsh
        env:
          SHOTKIT_SCENARIO: ${{ inputs.scenario }}
          SHOTKIT_REPEAT: ${{ inputs.repeat }}
        run: ./tests/run-scenario-repeats.ps1 -ExePath target/release/shotkit.exe -Scenario $env:SHOTKIT_SCENARIO -RepeatCount $env:SHOTKIT_REPEAT
