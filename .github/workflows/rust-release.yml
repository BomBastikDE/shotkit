name: Rust tagged release
on:
  push:
    tags: ['v2.*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/rust-ci.yml
    permissions:
      contents: read
  publish-release:
    needs: checks
    if: ${{ startsWith(github.ref, 'refs/tags/v2.') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch current main for release ancestry check
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shotkit-windows-x64
          path: release-artifact
      - name: Create release without overwriting existing releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 rust/scripts/create-release.py release-artifact/shotkit.exe
